<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="resume-forge — AI resume and professional-profile management"
    />
    <title>resume-forge</title>
    <style>
      .rf-boot {
        --boot-bg: #f5f3f8;
        --boot-paper: #fff;
        --boot-ink: #271f35;
        --boot-muted: #746781;
        --boot-line: #92829f;
        --boot-border: #ded7e8;
        --boot-accent: #6631c2;
        --boot-signal: #207c8a;
        position: fixed;
        inset: 0;
        z-index: 10000;
        box-sizing: border-box;
        display: grid;
        grid-template-rows: auto 1fr auto;
        gap: 16px;
        overflow: auto;
        padding: clamp(20px, 4vw, 44px);
        background: var(--boot-bg);
        color: var(--boot-ink);
        font:
          14px/1.5 system-ui,
          -apple-system,
          BlinkMacSystemFont,
          sans-serif;
        isolation: isolate;
      }
      .rf-boot::before {
        content: "";
        position: absolute;
        inset: 0;
        z-index: -1;
        pointer-events: none;
        background-image: radial-gradient(
          var(--boot-line) 0.65px,
          transparent 0.65px
        );
        background-size: 26px 26px;
        mask-image: radial-gradient(
          ellipse 40% 55% at 50% 43%,
          #0003,
          transparent
        );
      }
      .rf-boot p,
      .rf-boot h1 {
        margin: 0;
      }
      .rf-boot h1 {
        font-family: inherit;
      }
      .rf-boot-header,
      .rf-boot-footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
      }
      .rf-boot-brand {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 17px;
        letter-spacing: -0.04em;
        font-weight: 650;
      }
      .rf-boot-brand svg {
        color: var(--boot-accent);
      }
      .rf-boot-edition {
        padding: 5px 11px;
        border: 1px solid var(--boot-border);
        border-radius: 30px;
        color: var(--boot-muted);
        font-size: 11px;
      }
      .rf-boot-content {
        align-self: center;
        justify-self: center;
        width: min(100%, 600px);
        padding-bottom: 12px;
        text-align: center;
      }
      .rf-boot-art {
        display: block;
        width: min(100%, 560px);
        height: auto;
        margin: -12px auto -14px;
        overflow: visible;
      }
      .rf-boot-guides {
        fill: none;
        stroke: var(--boot-line);
        stroke-width: 1;
        opacity: 0.65;
      }
      .rf-boot-wires {
        fill: none;
        stroke: var(--boot-accent);
        stroke-width: 1;
        opacity: 0.45;
      }
      .rf-boot-paper {
        fill: var(--boot-paper);
        stroke: var(--boot-line);
        stroke-width: 1;
      }
      .rf-boot-rule {
        fill: var(--boot-line);
      }
      .rf-boot-bold {
        fill: var(--boot-accent);
      }
      .rf-boot-small {
        fill: var(--boot-muted);
        font-size: 11px;
        letter-spacing: 0.01em;
      }
      .rf-boot-token {
        fill: var(--boot-bg);
        stroke: var(--boot-border);
      }
      .rf-boot-scan {
        animation: rf-boot-scan 4s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      .rf-boot-core {
        fill: var(--boot-paper);
        stroke: var(--boot-accent);
      }
      .rf-boot-halo {
        fill: none;
        stroke: var(--boot-accent);
        opacity: 0.18;
        animation: rf-boot-pulse 4s ease-in-out infinite;
      }
      .rf-boot-title {
        font-size: clamp(28px, 4vw, 40px);
        font-weight: 550;
        line-height: 1.15;
        letter-spacing: -0.05em;
      }
      .rf-boot-subtitle {
        margin-top: 12px !important;
        color: var(--boot-muted);
        font-size: 13px;
      }
      .rf-boot-status {
        display: grid;
        justify-items: center;
        gap: 13px;
        margin-top: 28px;
        color: var(--boot-muted);
        font-size: 12px;
      }
      .rf-boot-track {
        width: 164px;
        height: 2px;
        overflow: hidden;
        background: var(--boot-border);
        border-radius: 2px;
      }
      .rf-boot-runner {
        display: block;
        width: 55%;
        height: 100%;
        background: linear-gradient(
          90deg,
          transparent,
          var(--boot-accent),
          var(--boot-signal),
          transparent
        );
        animation: rf-boot-travel 2.4s ease-in-out infinite;
      }
      .rf-boot-footer {
        color: var(--boot-muted);
        font-size: 11px;
      }
      .rf-boot-footer span:last-child {
        color: var(--boot-accent);
      }
      .rf-boot-retry {
        margin-top: 16px !important;
        font-size: 12px;
        visibility: hidden;
      }
      .rf-boot-retry a {
        color: var(--boot-accent);
        text-underline-offset: 4px;
      }
      .rf-boot-retry a:focus-visible {
        outline: 2px solid var(--boot-accent);
        outline-offset: 5px;
        border-radius: 2px;
      }
      .rf-boot[data-waiting="true"] .rf-boot-retry {
        visibility: visible;
      }
      .rf-boot[data-paused="true"] * {
        animation-play-state: paused;
      }
      @keyframes rf-boot-scan {
        0% {
          transform: translateY(0);
          opacity: 0;
        }
        12% {
          opacity: 0.95;
        }
        82% {
          opacity: 0.95;
        }
        100% {
          transform: translateY(225px);
          opacity: 0;
        }
      }
      @keyframes rf-boot-pulse {
        0%,
        100% {
          opacity: 0.12;
        }
        50% {
          opacity: 0.4;
        }
      }
      @keyframes rf-boot-travel {
        from {
          transform: translateX(-105%);
        }
        to {
          transform: translateX(285%);
        }
      }
      @media (prefers-color-scheme: dark) {
        .rf-boot {
          --boot-bg: #111014;
          --boot-paper: #1b1921;
          --boot-ink: #f8f6fd;
          --boot-muted: #aaa2b8;
          --boot-line: #625571;
          --boot-border: #393341;
          --boot-accent: #b89aff;
          --boot-signal: #82d8dc;
        }
      }
      :root[data-theme="dark"] .rf-boot {
        --boot-bg: #111014;
        --boot-paper: #1b1921;
        --boot-ink: #f8f6fd;
        --boot-muted: #aaa2b8;
        --boot-line: #625571;
        --boot-border: #393341;
        --boot-accent: #b89aff;
        --boot-signal: #82d8dc;
      }
      :root[data-theme="light"] .rf-boot {
        --boot-bg: #f5f3f8;
        --boot-paper: #fff;
        --boot-ink: #271f35;
        --boot-muted: #746781;
        --boot-line: #92829f;
        --boot-border: #ded7e8;
        --boot-accent: #6631c2;
        --boot-signal: #207c8a;
      }
      @media (max-width: 420px) {
        .rf-boot-header {
          gap: 8px;
        }
        .rf-boot-brand {
          font-size: 15px;
        }
        .rf-boot-art {
          margin-top: 0;
          margin-bottom: 0;
        }
        .rf-boot-footer span:last-child {
          display: none;
        }
        .rf-boot-footer {
          justify-content: center;
        }
      }
      @media (max-height: 700px) {
        .rf-boot {
          padding: 20px 32px;
          gap: 8px;
        }
        .rf-boot-art {
          max-width: 400px;
          margin-top: -25px;
          margin-bottom: -22px;
        }
        .rf-boot-title {
          font-size: 27px;
        }
        .rf-boot-title br {
          display: none;
        }
        .rf-boot-status {
          margin-top: 16px;
        }
        .rf-boot-subtitle {
          margin-top: 7px !important;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .rf-boot * {
          animation: none !important;
        }
        .rf-boot-scan {
          transform: translateY(115px);
          opacity: 0.7;
        }
        .rf-boot-runner {
          width: 100%;
          opacity: 0.5;
        }
      }
      @media (forced-colors: active) {
        .rf-boot {
          background: Canvas;
          color: CanvasText;
        }
        .rf-boot-art {
          forced-color-adjust: auto;
        }
        .rf-boot-track {
          border: 1px solid CanvasText;
        }
      }
    </style>
  </head>

    <script>
      (() => {
        const root = document.getElementById("root");
        const boot = document.getElementById("rf-boot");
        if (!root || !boot) return;
        const pause = () => {
          boot.dataset.paused = String(document.hidden);
        };
        pause();
        document.addEventListener("visibilitychange", pause);
        const retry = window.setTimeout(() => {
          boot.dataset.waiting = "true";
        }, 15000);
        const observer = new MutationObserver(() => {
          const main = root.querySelector("#main-content");
          // Navigation can briefly render an empty outlet. Keep the first-load
          // screen through that handoff, but reveal real pages and errors at once.
          if (
            !main?.textContent.trim() ||
            main.querySelector(".rf-studio-loading")
          )
            return;
          observer.disconnect();
          window.clearTimeout(retry);
          document.removeEventListener("visibilitychange", pause);
          root.removeAttribute("inert");
          root.removeAttribute("aria-hidden");
          boot.remove();
        });
        observer.observe(root, { childList: true, subtree: true });
      })();
    </script>
